# trtllm-bench --extra_llm_api_options config for the TokenSpeed MLA
# evaluation on Kimi K2.5 — TP8 sibling of bench-config.yml.
#
# Sibling of: bench-config.yml (TP4, effective num_heads=32)
# This file:  TP8, effective num_heads = 128 / 8 = 16
#
# Why TP8: TokenSpeed's fold_sq_factor benefit grows as effective num_heads
# shrinks (it boosts BMM1 M utilization when num_heads is small). TP8 → 16
# effective heads is the larger-win regime; TP4 → 32 matches a representative
# K2.5 NVFP4 production placement. Running both isolates the win as a
# function of TP.
#
# Model:  nvidia/Kimi-K2-Thinking-NVFP4
# GPU:    8× Blackwell SXM (B200 / B300)
# Dataset: token-norm-dist, ISL=1024, OSL=1024, 64 requests, concurrency=1
#
# Invocation:
#   # Baseline:
#   TRTLLM_ENABLE_TRTLLM_GEN_ATTENTION=1 TLLM_TOKENSPEED_MLA=0 \
#       trtllm-bench --model nvidia/Kimi-K2-Thinking-NVFP4 \
#           throughput --dataset synth_1k1k_64.txt \
#           --extra_llm_api_options bench-1k1k_tp8_conc1.yml --concurrency 1
#
#   # TokenSpeed variant:
#   TRTLLM_ENABLE_TRTLLM_GEN_ATTENTION=1 TLLM_TOKENSPEED_MLA=1 \
#       trtllm-bench --model nvidia/Kimi-K2-Thinking-NVFP4 \
#           throughput --dataset synth_1k1k_64.txt \
#           --extra_llm_api_options bench-1k1k_tp8_conc1.yml --concurrency 1

max_batch_size: 1
max_num_tokens: 2176
max_seq_len: 2068

# Dense MLA TP8 — effective num_heads = 16, deeper into the TokenSpeed regime.
tensor_parallel_size: 8
moe_expert_parallel_size: 8
# AttentionDP intentionally OFF for min-latency BS=1 A/B (kernel-clean
# comparison with the BS=1 siblings).

cuda_graph_config:
  enable_padding: true
  max_batch_size: 1

kv_cache_config:
  dtype: fp8
  free_gpu_memory_fraction: 0.8

moe_config:
  backend: TRTLLM

speculative_config:
  decoding_type: MTP
  max_draft_len: 1          # K2.5 native MTP=1 → q_len_per_req=2;
                            # floor for fold_sq_factor benefit.

stream_interval: 10
print_iter_log: true
trust_remote_code: true
