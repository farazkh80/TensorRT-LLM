# Standard trtllm-bench --extra_llm_api_options config for the Kimi K2.5
# TokenSpeed MLA evaluation — TP8 sibling of bench-config.yml.
#
# Sibling of: bench-config.yml (TP4, effective num_heads=32)
# This file:  TP8, effective num_heads = 128 / 8 = 16
#
# Why TP8: per the JIRA, TokenSpeed's fold_sq_factor benefit grows as effective
# num_heads shrinks (it boosts BMM1 M utilization when num_heads is small).
# TP8 → 16 effective heads is the larger-win regime; TP4 → 32 is the regime
# matched to the JIRA-stated K2.5 NVFP4 production placement. Running both
# isolates the win as a function of TP.
#
# Model:  nvidia/Kimi-K2-Thinking-NVFP4  (DeepSeek-V3 dense-MLA architecture)
# GPU:    8× B200 / B300 SXM6
# Dataset: token-norm-dist, ISL=1024, OSL=1024, 64 requests, concurrency=1
#
# Invocation (current-main edition):
#   bash scripts/run_bench_v2.sh bench-1k1k_tp8_conc1.yml
# Defaults model_path to /scratch/hf-cache-patched/k2.6-bf16kv (BF16 KV);
# TS arm uses attn_backend=TOKENSPEED_MLA; base arm uses TRTLLM and crashes
# on the current-main NVRTC bug, which is fine — the TS aggregate stands on
# its own.

max_batch_size: 1
max_num_tokens: 2176
max_seq_len: 2068

# Dense MLA TP8 — effective num_heads = 16, deeper into the TokenSpeed regime.
tensor_parallel_size: 8
moe_expert_parallel_size: 8
# AttentionDP intentionally OFF for min-latency BS=1 A/B (no batching to
# balance; keeps kernel-level comparison clean). For the eventual
# bench-1k1k_tp8_conc{16,32}.yml throughput configs, enable it.

cuda_graph_config:
  enable_padding: true
  max_batch_size: 1

# TokenSpeed swap point.
attn_backend: TOKENSPEED_MLA

kv_cache_config:
  # 'auto' lets the BF16-KV-patched K2.6 snapshot drive: KV stays BF16,
  # matching the TokenSpeed kernel's kv_cache.dtype == query.dtype gate.
  dtype: auto
  free_gpu_memory_fraction: 0.8

moe_config:
  backend: TRTLLM

# K2.6 ships num_nextn_predict_layers=0; MTP not available on this checkpoint.
# fold_sq_factor regime (q_len_per_req>1) therefore not reachable here.

stream_interval: 10
print_iter_log: true
trust_remote_code: true
