# Standard trtllm-bench --extra_llm_api_options config for the Kimi K2.5
# TokenSpeed MLA evaluation. One file = one experiment. This is the baseline
# experiment: min-latency, q_len_per_req=2 (MTP=1), TP4 NVFP4 — matches the
# JIRA-stated K2.5 production placement and the regime where TokenSpeed's
# fold_sq_factor wins (effective num_heads = 128 / TP4 = 32).
#
# Model:  nvidia/Kimi-K2-Thinking-NVFP4   (same arch as K2.5: DeepSeek-V3
#         dense-MLA, num_heads=128, kv_lora_rank=512, qk_rope_head_dim=64)
# GPU:    B200 / B300 SXM6 (sm_100 / sm_103)
# Dataset: token-norm-dist, ISL=1024, OSL=1024, 64 requests (single concurrency=1)
#
# Invocation (current-main edition — backend class, BF16 KV patched snapshot):
#   # TokenSpeed variant — uses the new TOKENSPEED_MLA backend; see
#   # tensorrt_llm/_torch/attention_backend/tokenspeed_mla_attention.py.
#   PYTHONPATH=/workspace/TensorRT-LLM \
#       trtllm-bench --model nvidia/Kimi-K2-Thinking-NVFP4 \
#           --model_path /scratch/hf-cache-patched/k2.6-bf16kv \
#           throughput --dataset synth_1k1k_64.txt \
#           --extra_llm_api_options bench-config.yml --concurrency 1
#
#   # Baseline (TRTLLM backend): currently broken on K2.6 current main due to
#   # upstream NVRTC compile failure on fmhaSm103aKernel_...HQk576HV512...ForGen
#   # (both QkvE4m3 and QkvBfloat16 variants). To compare, set attn_backend
#   # below to TRTLLM and run with the same command; the engine crashes during
#   # warmup. Track upstream fix separately.
#
# Sibling experiments (separate files, add when needed):
#   bench-1k1k_tp4_conc16.yml   throughput sweep at ~100 TPS/user target
#   bench-1k1k_tp8_conc1.yml    TP8 (effective heads=16, larger TS win)
#   bench-8k1k_tp4_conc1.yml    longer context, closer to the blog's regime
#   bench-1k1k_tp4_conc1_mtp3.yml  spec-decode regime (requires MTP-3-capable
#                                  checkpoint; the parity divergence from the
#                                  DSV3-Lite spike lives here)

max_batch_size: 1
max_num_tokens: 2176        # 1024 ISL + headroom; small enough for min-latency
max_seq_len: 2068           # 1024 + 1024 + margin

# Dense MLA TP4 deployment — matches JIRA's stated K2.5 NVFP4 placement and
# puts effective num_heads at 32, the TokenSpeed sweet spot.
tensor_parallel_size: 4
moe_expert_parallel_size: 4
# AttentionDP intentionally OFF for min-latency: BS=1 means there's nothing to
# balance, and we want the kernel-level A/B clean. Enable it for the
# throughput sweep configs.

cuda_graph_config:
  enable_padding: true
  max_batch_size: 1

# Attention backend — the TokenSpeed MLA-decode swap. Set to TRTLLM to
# benchmark the current-main baseline (will currently crash on K2.6 — see
# header comment).
attn_backend: TRTLLM

kv_cache_config:
  # dtype 'auto' lets the model config drive: the BF16-KV-patched K2.6
  # snapshot at /scratch/hf-cache-patched/k2.6-bf16kv/ has
  # hf_quant_config.json with kv_cache_quant_algo removed, so KV stays BF16.
  # TokenSpeed kernel asserts kv_cache.dtype == query.dtype, so BF16 KV +
  # BF16 Q is the only working combination on K2.6 today.
  dtype: auto
  free_gpu_memory_fraction: 0.8

moe_config:
  backend: TRTLLM           # matches DSR1 TP8 NVFP4 reference path

# K2.6 ships num_nextn_predict_layers=0 — no MTP weights in the
# checkpoint. The spike's q_len_per_req=2 / fold_sq_factor regime is
# therefore not reachable on K2.6 via the model's own MTP. For TokenSpeed's
# spec-decode regime, the path forward is one of:
#   (a) Eagle/draft model attached separately,
#   (b) a K2.6-with-MTP-weights checkpoint variant (does not exist today),
#   (c) accept q_len_per_req=1 measurements and validate vs DSV3-Lite spike.
# For now: no speculative decoding. Measurement happens at q_len=1, which
# is the spike-confirmed PASS regime (DSV3-Lite step 5).

stream_interval: 10
print_iter_log: true
trust_remote_code: true
