# Standard trtllm-bench --extra_llm_api_options config for the Kimi K2.5
# TokenSpeed MLA evaluation — TP4 throughput sweep at concurrency=16.
#
# Sibling of:
#   bench-config.yml             (TP4, BS=1 min-latency)
#   bench-1k1k_tp8_conc1.yml     (TP8, BS=1, deeper TS regime)
# This file:
#   TP4, concurrency=16 — targets the JIRA-quoted "~11% higher throughput
#   around 100 TPS/user" regime. TokenSpeed's blog max-BS-tested is 16, so
#   this is the upper edge of their reported decode-win envelope on K2.5.
#
# Model:  nvidia/Kimi-K2-Thinking-NVFP4  (DeepSeek-V3 dense-MLA architecture)
# GPU:    4× B200 / B300 SXM6
# Dataset: token-norm-dist, ISL=1024, OSL=1024, ≥256 requests (need enough
#          for the conc=16 sweep to reach steady state)
#
# Invocation:
#   # Baseline:
#   TRTLLM_ENABLE_TRTLLM_GEN_ATTENTION=1 TLLM_TOKENSPEED_MLA=0 \
#       trtllm-bench --model nvidia/Kimi-K2-Thinking-NVFP4 \
#           throughput --dataset synth_1k1k_256.txt \
#           --extra_llm_api_options bench-1k1k_tp4_conc16.yml --concurrency 16
#
#   # TokenSpeed variant:
#   TRTLLM_ENABLE_TRTLLM_GEN_ATTENTION=1 TLLM_TOKENSPEED_MLA=1 \
#       trtllm-bench --model nvidia/Kimi-K2-Thinking-NVFP4 \
#           throughput --dataset synth_1k1k_256.txt \
#           --extra_llm_api_options bench-1k1k_tp4_conc16.yml --concurrency 16

max_batch_size: 64          # conc=16 + spec-decode bursts (16 × q_len_per_req=2)
                            # + CUDA graph padding headroom.
max_num_tokens: 5248        # one full prefill batch (16 × ISL=1024 chunked) + margin.
max_seq_len: 2068

tensor_parallel_size: 4
moe_expert_parallel_size: 4
# AttentionDP intentionally OFF for this experiment too: keeps the kernel-level
# A/B for TS vs baseline apples-to-apples with the BS=1 siblings. Add a
# bench-1k1k_tp4_conc16_attndp.yml sibling later if we want to measure the
# AttentionDP × TokenSpeed interaction.

cuda_graph_config:
  enable_padding: true
  max_batch_size: 64

kv_cache_config:
  dtype: fp8
  free_gpu_memory_fraction: 0.8

moe_config:
  backend: TRTLLM

speculative_config:
  decoding_type: MTP
  max_draft_len: 1          # K2.5 native MTP=1 → q_len_per_req=2.
                            # The blog's headline ratio "decode token num =
                            # BS × 4" implies MTP=3 (q_len=4); add an
                            # bench-1k1k_tp4_conc16_mtp3.yml sibling once
                            # we have a K2.5 checkpoint with ≥3 MTP layers.

stream_interval: 10
print_iter_log: true
trust_remote_code: true
