# K2.5 NVFP4 + EAGLE-3 (max_draft_len=3), TP=4, single-node B300.
#
# Adapted from NVIDIA/srt-slurm PR #24 recipe:
#   recipes/kimi2.5/trtllm_dynamo/disagg/gb200Nvfp4/ISL1K_OSL1K/MTP/
#     ctx1dep4_gen5tep4_batch2_allconc_eplb0_mtp3.yaml
#   (decode side only; the disagg / wide-EP and prefill-worker bits are
#   stripped to match a single-node aggregate setup.)
#
# Target model:  /scratch/hf-cache-patched/k2.5-bf16kv  (BF16 KV patch of
#                nvidia/Kimi-K2.5-NVFP4; required because TokenSpeed's MLA
#                kernel asserts kv.dtype == q.dtype).
# Draft model:   nvidia/Kimi-K2.5-Thinking-Eagle3
#                resolved to a local snapshot dir below.
#
# Backend swap: the ts sidecar config sed's `attn_backend: TRTLLM` ->
# `attn_backend: TOKENSPEED_MLA`. Everything else is identical.

tensor_parallel_size: 4
moe_expert_parallel_size: 4
pipeline_parallel_size: 1
enable_attention_dp: false
enable_lm_head_tp_in_adp: false
trust_remote_code: true

max_batch_size: 2
# max_num_tokens raised from the recipe's decode-only value of 8 to 2176
# so a 1024-token prefill request can complete in a single iter (instead
# of being chunked into 128 chunks of 8 tokens each — which made the
# 7th-attempt warmup never progress past iter=1). 2176 = 2 * 1024 ISL +
# 128 headroom (margin for draft tokens + spec metadata).
max_num_tokens: 2176
max_seq_len: 2088           # 1024 ISL + 1024 OSL + margin (matches recipe)
# print_iter_log was on in the recipe; turned off here because at the
# trtllm-bench autotuner phase it produces 1.3M+ idle-iter spam lines
# that flood the log (>400 MB per run) and obscure real progress markers.
print_iter_log: false
stream_interval: 100

cuda_graph_config:
  enable_padding: true
  batch_sizes:
    - 1
    - 2
    - 4

moe_config:
  backend: TRTLLM
  use_low_precision_moe_combine: true

kv_cache_config:
  # dtype 'auto' lets the model config drive: the patched k2.5-bf16kv
  # snapshot has kv_cache_quant_algo removed, so KV stays BF16. This is
  # what TokenSpeed needs to satisfy kv.dtype == q.dtype.
  dtype: auto
  enable_block_reuse: false
  free_gpu_memory_fraction: 0.85

nvfp4_gemm_config:
  allowed_backends:
    - cutlass
    - cublaslt
    - cutedsl
    - cuda_core

speculative_config:
  decoding_type: Eagle
  max_draft_len: 3
  speculative_model_dir: /scratch/hf-cache/models--nvidia--Kimi-K2.5-Thinking-Eagle3/snapshots/0b0c6ac039089ad2c2418c91c039553381a302d9

# Attention backend — Phase 5 A/B: sed this to TRTLLM (base arm) or
# TOKENSPEED_MLA (ts arm). The two sidecar configs are generated by
# scripts/run_bench_k25.sh.
attn_backend: TRTLLM
