# Standard trtllm-bench --extra_llm_api_options config for the Kimi K2.5
# TokenSpeed MLA evaluation — long-context, BS=1.
#
# Sibling of:
#   bench-config.yml             (TP4, BS=1, ISL=OSL=1k — short min-latency)
# This file:
#   TP4, BS=1, ISL=8k / OSL=1k — long-context min-latency.
#
# Why long context matters for this eval:
#
# The TokenSpeed blog reports its MLA wins on a workload with *average ISL=60k*,
# OSL=500, multi-turn (per the JIRA's evaluation notes). At long context the
# MLA decode kernel spends proportionally more time in the BMM2-against-KV-cache
# step, which is where TokenSpeed's split-KV partial-reduction reorganization
# operates. The kernel-level win at 1k context (the bench-config.yml number)
# is the *floor*; long-context is where TS's claim should be larger if their
# fold_sq_factor + split-KV reorg are the dominant gains.
#
# Why ISL=8k and not 60k: 60k × Kimi K2.5 dense MLA KV cache (kv_lora_rank=512,
# qk_rope_head_dim=64, num_layers≈61) does not fit on 4× B200/B300 at BS=1
# unless we drop free_gpu_memory_fraction aggressively and lose other
# experimental controls. 8k is the largest round number that comfortably fits
# our standard kv_cache_config and matches an existing DSR1 reference shape
# (8k1k_tp4_conc1024.yaml). For the 60k-scale blog regime we'd need a
# separate B300 / TP8 / fp4-KV-cache config that's its own follow-up.
#
# Model:  nvidia/Kimi-K2-Thinking-NVFP4  (DeepSeek-V3 dense-MLA architecture)
# GPU:    4× B200 / B300 SXM6
# Dataset: token-norm-dist, ISL=8192, OSL=1024, ≥32 requests
#
# Invocation (current-main edition):
#   bash scripts/run_bench_v2.sh bench-8k1k_tp4_conc1.yml
# Defaults model_path to /scratch/hf-cache-patched/k2.6-bf16kv (BF16 KV);
# TS arm uses attn_backend=TOKENSPEED_MLA; base arm uses TRTLLM and crashes
# on the current-main NVRTC bug.

max_batch_size: 1
max_num_tokens: 8768        # one full ISL=8192 prefill chunked batch + margin.
max_seq_len: 9416           # 8192 + 1024 + margin (matches DSR1 8k1k reference).

tensor_parallel_size: 4
moe_expert_parallel_size: 4
# AttentionDP intentionally OFF — same rationale as the other TP4 siblings:
# isolate the kernel-level TokenSpeed effect. A long-context AttnDP variant
# (bench-8k1k_tp4_conc16_attndp.yml) would be the natural production-realistic
# follow-up if/when the min-latency long-context number reproduces the win.

cuda_graph_config:
  enable_padding: true
  max_batch_size: 1

# TokenSpeed swap point.
attn_backend: TOKENSPEED_MLA

kv_cache_config:
  # 'auto' lets the BF16-KV-patched K2.6 snapshot drive: KV stays BF16,
  # matching the TokenSpeed kernel's kv_cache.dtype == query.dtype gate.
  dtype: auto
  free_gpu_memory_fraction: 0.8

moe_config:
  backend: TRTLLM

# K2.6 ships num_nextn_predict_layers=0; MTP not available on this checkpoint.

stream_interval: 10
print_iter_log: true
trust_remote_code: true
