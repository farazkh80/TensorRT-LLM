# trtllm-bench --extra_llm_api_options config for evaluating the TokenSpeed
# MLA decode kernel (https://github.com/lightseekorg/tokenspeed) on Kimi K2.5
# / K2-Thinking. One file = one experiment.
#
# This file is the baseline: min-latency, q_len_per_req=2 (MTP=1), TP4 NVFP4.
# This is a representative K2.5 NVFP4 production placement and is in the
# regime where TokenSpeed's fold_sq_factor optimization is expected to win
# (effective num_heads = 128 / TP4 = 32).
#
# Model:  nvidia/Kimi-K2-Thinking-NVFP4  (DeepSeek-V3-style dense-MLA arch:
#         num_heads=128, kv_lora_rank=512, qk_rope_head_dim=64)
# GPU:    4× Blackwell SXM (B200 / B300, sm_100 / sm_103)
# Dataset: token-norm-dist, ISL=1024, OSL=1024, 64 requests, concurrency=1
#
# Invocation:
#   # Baseline:
#   TRTLLM_ENABLE_TRTLLM_GEN_ATTENTION=1 TLLM_TOKENSPEED_MLA=0 \
#       trtllm-bench --model nvidia/Kimi-K2-Thinking-NVFP4 \
#           throughput --dataset synth_1k1k_64.txt \
#           --extra_llm_api_options bench-config.yml --concurrency 1
#
#   # TokenSpeed variant (kernel swap inside run_mla_generation):
#   TRTLLM_ENABLE_TRTLLM_GEN_ATTENTION=1 TLLM_TOKENSPEED_MLA=1 \
#       trtllm-bench --model nvidia/Kimi-K2-Thinking-NVFP4 \
#           throughput --dataset synth_1k1k_64.txt \
#           --extra_llm_api_options bench-config.yml --concurrency 1
#
# Sibling experiments (separate files in this directory):
#   bench-1k1k_tp4_conc16.yml          throughput sweep
#   bench-1k1k_tp8_conc1.yml           TP8 (effective num_heads=16)
#   bench-8k1k_tp4_conc1.yml           longer context
#   bench-*_mtp3.yml                   spec-decode regime (q_len_per_req=4)

max_batch_size: 1
max_num_tokens: 2176        # 1024 ISL + headroom; small enough for min-latency
max_seq_len: 2068           # 1024 + 1024 + margin

# Dense MLA TP4 — effective num_heads at 32, the TokenSpeed sweet spot.
tensor_parallel_size: 4
moe_expert_parallel_size: 4
# AttentionDP intentionally OFF for min-latency: BS=1 has nothing to balance,
# and we want the kernel-level A/B clean. Enable it for throughput configs.

cuda_graph_config:
  enable_padding: true
  max_batch_size: 1

kv_cache_config:
  dtype: fp8
  free_gpu_memory_fraction: 0.8

moe_config:
  backend: TRTLLM

speculative_config:
  decoding_type: MTP
  max_draft_len: 1          # K2.5 native MTP=1 → q_len_per_req=2.
                            # fold_sq_factor needs q_len_per_req > 1;
                            # this is the floor for any TokenSpeed benefit.

stream_interval: 10
print_iter_log: true
trust_remote_code: true
